name: Publish portable release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag
        required: true
        default: v0.5.5
      artifact_ref:
        description: Temporary verified artifact branch
        required: true
        default: release-input/v0.5.5

permissions:
  contents: write

jobs:
  windows-check:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install UI test dependency
        run: python -m pip install numpy
      - name: Check frozen runtime, UI and cancellation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
        run: python tools/check_prebuilt_windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: windows-validation
          retention-days: 7
  publish:
    needs: windows-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and publish the prebuilt package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
        run: python3 tools/publish_prebuilt.py
